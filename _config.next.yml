# DUMBLOG / NexT 主题配置
# 所有配置值保持显式设置，避免整理配置时改变现有外观或功能。
# 完整选项说明：https://theme-next.js.org/docs/
# 自定义颜色与样式维护说明：docs/theme-maintenance.md

# 核心与自定义样式入口
cache:
  enable: true
minify: true
custom_file_path:
  style: source/_data/styles.styl

# 布局方案
scheme: Mist
darkmode: false

# 站点标识与版权
favicon:
  small: favicon16.ico
  medium: favicon32.ico
  apple_touch_icon: favicon.ico
  safari_pinned_tab: logo.svg
custom_logo: #/uploads/custom-logo.jpg
creative_commons:
  license: by-nc-sa
  size: small
  sidebar: false
  post: false
  language:
open_graph:
  enable: true
  options:

# 导航菜单
menu:
  about: /about/ || fa fa-user
  tags: /tags/ || fa fa-tags
  categories: /categories/ || fa fa-th
  archives: /archives/ || fa fa-archive
menu_settings:
  icons: false
  badges: false

# 侧栏、社交链接与目录
sidebar:
  position: right
  display: remove
  padding: 18
  offset: 12
avatar:
  url: #/images/avatar.png
  rounded: false
  rotated: false
site_state: true
social:
  GitHub: https://github.com/Dumby-cat || fab fa-github
  E-Mail: mailto:Dumblog@163.com || fa fa-envelope
social_icons:
  enable: true
  icons_only: false
  transition: false
links_settings:
  icon: fa fa-globe
  title: Links
  layout: block
links:
toc:
  enable: true
  number: true
  wrap: false
  expand_all: false
  max_depth: 6

# 页脚
language_switcher: false
footer:
  since: 2021
  icon:
    name: fa fa-heart
    animated: false
    color: "#ff0000"
  copyright:
  powered: false
  beian:
    enable: false
    icp:
    gongan_id:
    gongan_num:
    gongan_icon_url:

# 文章与元信息
excerpt_description: true
read_more_btn: true
post_meta:
  item_text: true
  created_at: true
  updated_at:
    enable: true
    another_day: true
  categories: true
symbols_count_time:
  separated_meta: true
  item_text_total: false
tag_icon: false
reward_settings:
  enable: false
  animation: false
reward:
follow_me:
related_posts:
  enable: false
  title: # Custom header, leave empty to use the default one
  display_in_home: false
post_edit:
  enable: false
  url: https://github.com/user-name/repo-name/tree/branch-name/subdirectory-name/ # Link for view source
post_navigation: left

# 标签云与自定义页面
tagcloud:
  min: 13 # Minimum font size in px
  max: 13 # Maximum font size in px
  amount: 200 # Total amount of tags
  orderby: name # Order of tags
  order: 1 # Sort order
calendar:
  calendar_id: <required> # Your Google account E-Mail
  api_key: <required>
  orderBy: startTime
  showLocation: false
  offsetMax: 72 # Time Range
  offsetMin: 4 # Time Range
  showDeleted: false
  singleEvents: true
  maxResults: 250

# 显示、代码块与阅读工具
preconnect: false
text_align:
  desktop: justify
  mobile: justify
mobile_layout_economy: false
theme_color:
  light: "#121212"
  dark: "#121212"
body_scrollbar:
  overlay: false
  stable: false
codeblock:
  theme:
    light: base16/grayscale-dark
    dark: base16/grayscale-dark
  prism:
    light: prism
    dark: prism-dark
  copy_button:
    enable: true
    style: flat
back2top:
  enable: false
  sidebar: false
  scrollpercent: true
reading_progress:
  enable: false
  start_at: left
  position: top
  reversed: false
  color: "#37c6c0"
  height: 3px
bookmark:
  enable: false
  color: "#222"
  save: auto
github_banner:
  enable: false
  permalink: https://github.com/yourname
  title: Follow me on GitHub

# 字体（当前关闭外部字体配置，沿用现有效果）
font:
  enable: false
  host:
  global:
    external: true
    family: Lato
    size:
  title:
    external: true
    family:
    size:
  headings:
    external: true
    family:
    size:
  posts:
    external: true
    family:
  codes:
    external: true
    family:

# SEO 与外链
index_with_subtitle: true
exturl: true
exturl_icon: true
google_site_verification:
bing_site_verification:
yandex_site_verification:

# 公式与页面增强
math:
  every_page: false
  mathjax:
    enable: false
    tags: none
  katex:
    enable: true
    copy_tex: false
pjax: false
fancybox: false
mediumzoom: false
lazyload: false
pangu: false
quicklink:
  enable: false
  home: false
  archive: false
  delay: true
  timeout: 3000
  priority: true

# 评论服务
comments:
  style: tabs
  active:
  storage: true
  lazyload: false
  nav:
disqus:
  enable: false
  shortname:
  count: true
disqusjs:
  enable: false
  api:
  apikey: # Register new application from https://disqus.com/api/applications/
  shortname: # See: https://disqus.com/admin/settings/general/
changyan:
  enable: false
  appid:
  appkey:
livere_uid: # <your_uid>
gitalk:
  enable: false
  github_id: # GitHub repo owner
  repo: # Repository name to store issues
  client_id: # GitHub Application Client ID
  client_secret: # GitHub Application Client Secret
  admin_user: # GitHub repo owner and collaborators, only these guys can initialize gitHub issues
  distraction_free_mode: true # Facebook-like distraction free mode
  proxy: https://cors-anywhere.azm.workers.dev/https://github.com/login/oauth/access_token # This is official proxy address
  language:
utterances:
  enable: false
  repo: user-name/repo-name # Github repository owner and name
  issue_term: pathname
  theme: github-light
isso: # <data_isso>

# 文章小工具
rating:
  enable: false
  id:     # <app_id>
  color:  "#fc6423"
add_this_id:

# 统计服务
google_analytics:
  tracking_id: # <app_id>
  only_pageview: false
growingio_analytics: # <project_id>
cloudflare_analytics:
clarity_analytics: # <project_id>
leancloud_visitors:
  enable: false
  app_id: # <your app id>
  app_key: # <your app key>
  server_url: # <your server url>
  security: true
firestore:
  enable: false
  collection: articles # Required, a string collection name to access firestore database
  apiKey: # Required
  projectId: # Required
busuanzi_count:
  enable: false
  total_visitors: true
  total_visitors_icon: fa fa-user
  total_views: true
  total_views_icon: fa fa-eye
  post_views: true
  post_views_icon: far fa-eye

# 搜索
algolia_search:
  enable: false
  hits:
    per_page: 10
local_search:
  enable: true
  trigger: auto
  top_n_per_article: 1
  unescape: false
  preload: false

# 聊天服务
chat:
  enable: false
  icon: fa fa-comment # Icon name in Font Awesome, set false to disable icon.
  text: Chat # Button text, change it as you wish.
chatra:
  enable: false
  async: true
  id: # Visit Dashboard to get your ChatraID
tidio:
  enable: false
  key: # Public Key, get it from dashboard. See: https://www.tidio.com/panel/settings/developer
gitter:
  enable: false
  room:

# 内容标签
note:
  style: simple
  icons: false
  light_bg_offset: 0
tabs:
  sticky: false
  transition:
    tabs: false
    labels: true
pdf:
  enable: false
  height: 500px
mermaid:
  enable: false
  theme:
    light: default
    dark: dark

# 动画
motion:
  enable: false
  async: false
  transition:
    post_block: fadeIn
    post_header: fadeInDown
    post_body: fadeInDown
    coll_header: fadeInLeft
    sidebar: fadeInUp
pace:
  enable: false
  color: black
  theme: center-simple
canvas_ribbon:
  enable: false
  size: 300 # The width of the ribbon
  alpha: 0.6 # The transparency of the ribbon
  zIndex: -1 # The display level of the ribbon

# CDN 与资源路径
vendors:
  fontawesome: /lib/fontawesome/css/all.min.css
  internal: local
  plugins: cdnjs
  custom_cdn_url:
css: css
js: js
images: images
